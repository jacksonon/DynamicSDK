name: DynamicSDK
options:
  bundleIdPrefix: com.dynamic.sdk
  deploymentTarget:
    iOS: "12.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  DynamicSDK:
    type: framework
    platform: iOS
    deploymentTarget: "12.0"
    info:
      path: Sources/DynamicSDK/Info.plist
    sources:
      - path: Sources/DynamicSDK/Public
        type: folder
        buildPhase: headers
        headerVisibility: public
      - path: Sources/DynamicSDK/Internal
    scheme:
      testTargets: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dynamic.sdk.DynamicSDK
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(PODS_ROOT)/Headers/Public
          - $(PODS_CONFIGURATION_BUILD_DIR)/AFNetworking
          - $(PODS_CONFIGURATION_BUILD_DIR)/SDWebImage
    postbuildScripts:
      - script: "${SRCROOT}/Scripts/copy_third_party_headers.sh"
        name: Copy Third-Party Headers
        basedOnDependencyAnalysis: false
